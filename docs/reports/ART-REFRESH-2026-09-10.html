const labels={approved:'新图已检查',review:'新图待检查',retained:'保留旧图',pending:'新图未完成'};
const summary=document.querySelector('#summary'),grid=document.querySelector('#grid'),viewer=document.querySelector('#viewer');
summary.textContent=assets.length+' 个原图位置 · '+assets.filter(a=>a.status==='approved').length+' 张新图已检查 · '+assets.filter(a=>a.status==='review').length+' 张待检查 · '+assets.filter(a=>a.status==='retained').length+' 张保留旧图 · '+assets.filter(a=>a.status==='pending').length+' 张新图未完成';
let selected=null;function show(mode){const source=mode==='old'?selected.original:selected.image;document.querySelector('#large').src=source;document.querySelector('#large').alt=selected.name;document.querySelector('#original-link').href=source;document.querySelector('#viewer-title').textContent=selected.name+' · '+(mode==='old'?'旧图':labels[selected.status]);}
function open(a,mode){selected=a;show(mode);if(!viewer.open)viewer.showModal();}
function render(){grid.replaceChildren();const q=document.querySelector('#search').value.toLocaleLowerCase(),kind=document.querySelector('#kind').value,status=document.querySelector('#status').value;const filtered=assets.filter(a=>(kind==='all'||a.kind===kind)&&(status==='all'||a.status===status)&&(a.name+' '+a.id).toLocaleLowerCase().includes(q));document.querySelector('#count').textContent=filtered.length+' 项';for(const a of filtered){const card=document.createElement('article');card.className=a.kind+' '+a.status;const im=document.createElement('img');im.src=a.thumbnail;im.alt=a.name;im.loading='lazy';im.onclick=()=>open(a,'new');card.append(im);const info=document.createElement('div');info.className='info';const title=document.createElement('h2');title.textContent=a.name;info.append(title);const id=document.createElement('div');id.className='id';id.textContent=a.id;info.append(id);const label=document.createElement('p');label.className='label';label.textContent=labels[a.status];info.append(label);const first=document.createElement('button');first.textContent='查看大图';first.onclick=()=>open(a,'new');info.append(first);const old=document.createElement('button');old.textContent='对照旧图';old.onclick=()=>open(a,'old');info.append(old);const note=document.createElement('p');note.className='note';note.textContent=a.note;info.append(note);card.append(info);grid.append(card);}}
for(const id of ['search','kind','status'])document.getElementById(id).addEventListener('input',render);document.querySelector('#close').onclick=()=>viewer.close();document.querySelector('#show-new').onclick=()=>show('new');document.querySelector('#show-old').onclick=()=>show('old');render();</script></html>
